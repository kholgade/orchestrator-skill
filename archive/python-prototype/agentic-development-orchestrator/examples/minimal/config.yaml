project:
  id: minimal-demo
  name: Minimal Demo
  goal: Demonstrate a small source-driven implementation workflow.
  type: existing_application
  repository: .
  base_branch: main
  scope:
    included: [Implement the approved demo behavior]
    excluded: [Production deployment]
  deliverables: [Implementation, tests, final report]

sources:
  documents:
    - path: ./SPEC.md
      type: specification
      authority: primary
      required: true
  project_instructions: []
  precedence: [user_approved_instruction, project_governance, specification]

agents:
  - id: implementer
    role: implementer
    type: external
    adapter: cli
    command: "YOUR_AGENT_ADAPTER_COMMAND"
    model: "YOUR_MODEL"
    capabilities: [coding, testing]
    enabled: true
  - id: reviewer
    role: reviewer
    type: internal
    adapter: framework
    command: "YOUR_REVIEW_ADAPTER"
    model: "YOUR_REVIEW_MODEL"
    capabilities: [code_review, requirements_verification]
    independent_from: [implementer]
    enabled: true

tasks:
  - id: TASK-001
    milestone: M0
    title: Implement demo behavior
    goal: Implement behavior from SPEC.md.
    depends_on: []
    requirements: [REQ-001]
    write_scopes: [src]
    acceptance_criteria:
      - Required behavior is implemented.
      - Automated tests pass.
    implementer: implementer
    reviewer: reviewer
    verification_commands: []

execution:
  max_parallel_tasks: 1
  max_parallel_agents: 2
  max_rework_rounds: 2
  task_timeout_minutes: 60
  stop_on_blocking_finding: true

git:
  strategy: task
  base_branch: main
  milestone_branch_prefix: milestone/
  task_branch_prefix: task/
  worktrees:
    enabled: true
    root: .worktrees
    cleanup_after_integration: true
    preserve_on_failure: true

verification:
  independent_review_required: true
  required_checks: [acceptance_criteria, tests]
  require_evidence: true
  commands: []

approvals:
  plan_before_execution: true
  milestone_merge: true
  production_deployment: true
  destructive_operations: true
  scope_changes: true

state:
  path: .orchestrator/state.json
  event_log: .orchestrator/events.jsonl

delivery:
  report_path: .orchestrator/final-report.md
