# Copy to config.yaml and customize. JSON is also accepted as YAML if PyYAML is absent.
project:
  id: sample-app
  name: Sample Application
  goal: Implement the approved source requirements in the existing repository.
  type: existing_application
  repository: .
  base_branch: main
  scope:
    included: []
    excluded: []
  deliverables:
    - Working implementation
    - Automated tests
    - Delivery report

sources:
  documents:
    - path: ./docs/IMPLEMENTATION_PLAN.md
      type: implementation_plan
      authority: primary
      required: true
  project_instructions:
    - AGENTS.md
  precedence:
    - user_approved_instruction
    - project_governance
    - approved_specification
    - approved_design
    - implementation_plan

agents:
  - id: coder-a
    role: implementer
    type: external
    adapter: cli
    command: "REPLACE_WITH_APPROVED_AGENT_COMMAND"
    model: "REPLACE_WITH_MODEL"
    capabilities: [coding, refactoring, testing]
    enabled: true
  - id: reviewer-a
    role: reviewer
    type: internal
    adapter: framework
    command: "REPLACE_WITH_REVIEWER_ADAPTER"
    model: "REPLACE_WITH_MODEL"
    capabilities: [code_review, requirements_verification]
    independent_from: [coder-a]
    enabled: true

tasks:
  - id: TASK-001
    milestone: M0
    title: Example task
    goal: Replace this task with a requirement-derived task.
    depends_on: []
    requirements: [REQ-001]
    write_scopes: [src/example]
    acceptance_criteria:
      - The configured behavior is implemented and tested.
    implementer: coder-a
    reviewer: reviewer-a
    verification_commands: []

execution:
  max_parallel_tasks: 2
  max_parallel_agents: 4
  max_rework_rounds: 3
  task_timeout_minutes: 120
  stop_on_blocking_finding: true

git:
  strategy: milestone
  base_branch: main
  milestone_branch_prefix: milestone/
  task_branch_prefix: task/
  worktrees:
    enabled: true
    root: .worktrees
    cleanup_after_integration: true
    preserve_on_failure: true

verification:
  independent_review_required: true
  required_checks: [acceptance_criteria, tests, architecture_consistency]
  require_evidence: true
  commands: []

approvals:
  plan_before_execution: true
  milestone_merge: true
  production_deployment: true
  destructive_operations: true
  scope_changes: true

state:
  path: .orchestrator/state.json
  event_log: .orchestrator/events.jsonl

delivery:
  report_path: .orchestrator/final-report.md
